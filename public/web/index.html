<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A.U.R.A - Asset Unveiling &amp; Reconnaissance Automation</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <canvas id="backgroundScope" class="background-scope" aria-hidden="true"></canvas>
  <header>
    <div class="headerbar">
      <h1>A.U.R.A - Asset Unveiling &amp; Reconnaissance Automation</h1>
      <p id="status" class="muted"></p>
    </div>
  </header>

  <nav class="tabs" aria-label="Workspace tabs">
    <button class="tab" data-tab="recon">Recon</button>
    <button class="tab" data-tab="wordlists">Wordlists</button>
    <button class="tab" data-tab="search">Search</button>
    <button class="tab" data-tab="topology">Topology</button>
    <button class="tab" data-tab="projects">Projects</button>
    <button class="tab" data-tab="results">Results</button>
    <button class="tab" data-tab="ai-log">AI Log</button>
    <button class="tab" data-tab="runs">Runs & Logs</button>
    <button class="tab" data-tab="guide">Guide</button>
    <button class="tab active" data-tab="settings">Settings</button>
  </nav>

  <main class="workspace">
    <div class="workspace-main">
    <!-- This file is intentionally maintained by the main app bundle. -->
    <section id="tab-recon" class="tab-panel"></section>
    </div>
  </main>

  <script src="/wave-background.js"></script>
  <script src="/ai-agent.js"></script>
  <script src="/ai-log.js"></script>
  <script src="/results-explorer.js"></script>
  <script src="/proxy-settings.js"></script>
  <script src="/topology-view.js"></script>
  <script src="/app.js"></script>
  <script src="/wordlist-metadata.js"></script>
</body>
</html>
