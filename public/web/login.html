<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A.U.R.A Login</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body class="login-body">
  <canvas id="backgroundScope" class="background-scope" aria-hidden="true"></canvas>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <svg class="login-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="A.U.R.A icon"><defs><linearGradient id="auraLoginGradient" x1="20" y1="108" x2="108" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#2f8df5"/><stop offset=".55" stop-color="#6ff4ee"/><stop offset="1" stop-color="#e8cf74"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="#05080c"/><path d="M26 100 57 20h16l29 80H82l-6-18H52l-6 18H26Zm31-34h14L64 43l-7 23Z" fill="url(#auraLoginGradient)"/><circle cx="64" cy="65" r="13" fill="#071018" stroke="#6ff4ee" stroke-width="4"/><path d="M64 65 88 49M64 65 43 82" stroke="#e8cf74" stroke-width="3" stroke-linecap="round"/><circle cx="88" cy="49" r="5" fill="#e8cf74"/><circle cx="43" cy="82" r="5" fill="#2f8df5"/></svg>
        <h1>A.U.R.A</h1>
      </div>
      <p class="brand-subtitle">Asset Unveiling &amp; Reconnaissance Automation</p>
      <p class="muted">Sign in to access the local recon workbench.</p>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" value="locu" autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="login">Sign In</button>
      <div id="loginStatus" class="notice muted">Use your local A.U.R.A account.</div>
    </section>
  </main>
  <script src="/wave-background.js"></script>
  <script src="/login-cookie.js"></script>
</body>
</html>
