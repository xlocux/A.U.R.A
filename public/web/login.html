<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A.U.R.A Login</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body class="login-body">
  <canvas id="backgroundScope" class="background-scope" aria-hidden="true"></canvas>
  <main class="login-shell">
    <section class="login-card">
      <h1>A.U.R.A</h1>
      <p class="brand-subtitle">Asset Unveiling &amp; Reconnaissance Automation</p>
      <p class="muted">Sign in to access the local recon workbench.</p>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" value="locu" autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="login">Sign In</button>
      <div id="loginStatus" class="notice muted">Use your local A.U.R.A account.</div>
    </section>
  </main>
  <script src="/wave-background.js"></script>
  <script src="/login-cookie.js"></script>
</body>
</html>
